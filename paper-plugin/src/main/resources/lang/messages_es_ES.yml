# VoiceEngine Spanish Language Bundle (es_ES)
prefix: "<gradient:#00d2ff:#3a7bd5><b>[VoiceEngine]</b></gradient> "
prefix_admin: "<gradient:#f12711:#f5af19><b>[VoiceEngine Admin]</b></gradient> "

command:
  connect:
    prompt: "<prefix><click:open_url:'<url>'><hover:show_text:'<yellow>Haz clic para abrir el enlace de conexión</yellow>'><u><green>Haz clic aquí para conectar tu micrófono</green></u></hover></click> <gray>(código: <white><token></white>, expira en <time>)</gray>"
    only_players: "<prefix><red>Solo los jugadores pueden conectarse a VoiceEngine.</red>"
    no_permission: "<prefix><red>No tienes permiso para usar VoiceEngine.</red>"
    backend_offline: "<prefix><red>El servidor de voz está desconectado. No se puede generar la sesión.</red>"
  admin:
    prompt: "<prefix_admin><click:open_url:'<url>'><hover:show_text:'<gold>Haz clic para abrir el Panel de Administración</gold>'><u><yellow>Haz clic aquí para abrir el Panel de Administración</yellow></u></hover></click> <gray>(código: <white><token></white>, expira en <time>)</gray>"
    no_permission: "<prefix_admin><red>No tienes permiso para acceder al panel de administración de VoiceEngine.</red>"
    backend_offline: "<prefix_admin><red>El servidor de voz está desconectado. No se puede generar la sesión administrativa.</red>"
  reload:
    success: "<prefix><green>¡Configuración y archivos de idioma recargados exitosamente!</green>"
    no_permission: "<prefix><red>No tienes permiso para recargar VoiceEngine.</red>"
  status:
    header: "<prefix><dark_aqua>--- Estado del Backend de VoiceEngine ---</dark_aqua>"
    connected: "<gray>Estado: <green>CONECTADO</green></gray>"
    disconnected: "<gray>Estado: <red>DESCONECTADO</red> <dark_gray>(intentos de reconexión: <yellow><attempts></yellow>)</dark_gray></gray>"
    uri: "<gray>URI del Servidor: <aqua><uri></aqua></gray>"
    active_tokens: "<gray>Tokens de Sesión Activos: <gold><count></gold></gray>"
    no_permission: "<prefix><red>No tienes permiso para inspeccionar el estado de VoiceEngine.</red>"
  speaker:
    created: "<prefix_admin><green>Bloque altavoz <yellow><id></yellow> creado en (<x>, <y>, <z>) con radio de <radius>m.</green>"
    removed: "<prefix_admin><green>Bloque altavoz <yellow><id></yellow> eliminado.</green>"
    not_found: "<prefix_admin><red>Bloque altavoz <yellow><id></yellow> no encontrado.</red>"
    already_exists: "<prefix_admin><red>El bloque altavoz <yellow><id></yellow> ya existe.</red>"
    must_look_at_block: "<prefix_admin><red>Debes estar apuntando a un bloque sólido a menos de 5 bloques.</red>"
    linked: "<prefix_admin><green>Voz de <yellow><player></yellow> vinculada al altavoz <yellow><id></yellow>.</green>"
    unlinked: "<prefix_admin><green>Voz desvinculada del altavoz <yellow><id></yellow>.</green>"
    redstone_set: "<prefix_admin><green>Requisito de redstone para el altavoz <yellow><id></yellow> establecido en <yellow><value></yellow>.</green>"
    list_header: "<prefix_admin><gold>--- Bloques Altavoz Registrados (<count>) ---</gold>"
    list_item: "<gray>- <yellow><id></yellow>: (<x>, <y>, <z>) en <world> | Radio: <radius>m | Enlazado: <aqua><linked></aqua> | Redstone: <redstone></gray>"
    no_speakers: "<prefix_admin><gray>No hay bloques altavoces registrados.</gray>"
  moderation:
    kick_success: "<prefix_admin><green>Se expulsó a <yellow><player></yellow> del chat de voz. Razón: <reason></green>"
    mute_success: "<prefix_admin><green>Se silenció a <yellow><player></yellow> por <time>. Razón: <reason></green>"
    deafen_success: "<prefix_admin><green>Se ensordeció a <yellow><player></yellow> por <time>. Razón: <reason></green>"
    ban_success: "<prefix_admin><green>Se baneó a <yellow><player></yellow> del chat de voz por <time>. Razón: <reason></green>"
    unmute_success: "<prefix_admin><green>Se quitó el silencio a <yellow><player></yellow>.</green>"
    undeafen_success: "<prefix_admin><green>Se restableció la audición a <yellow><player></yellow>.</green>"
    unban_success: "<prefix_admin><green>Se desbaneó a <yellow><player></yellow>.</green>"
    player_not_found: "<prefix_admin><red>Jugador <yellow><player></yellow> no encontrado.</red>"
    not_punished: "<prefix_admin><red>El jugador <yellow><player></yellow> no tiene una sanción activa de tipo <type>.</red>"
    kicked_notice: "<prefix><red>Fuiste expulsado del chat de voz. Razón: <white><reason></white></red>"
    muted_notice: "<prefix><red>Has sido silenciado en el chat de voz por <time>. Razón: <white><reason></white></red>"
    deafened_notice: "<prefix><red>Has sido ensordecido en el chat de voz por <time>. Razón: <white><reason></white></red>"
    banned_notice: "<prefix><red>Estás baneado del chat de voz por <time>. Razón: <white><reason></white></red>"
    unmuted_notice: "<prefix><green>Ya no estás silenciado en el chat de voz.</green>"
    undeafened_notice: "<prefix><green>Tu audición en el chat de voz ha sido restablecida.</green>"
    status_header: "<prefix_admin><gold>--- Estado de Moderación de Voz: <player> ---</gold>"
    status_active: "<gray>Activo: <red><type></red> (Expira en: <yellow><time></yellow>) | Razón: <reason></gray>"
    status_none: "<prefix_admin><gray>No hay sanciones activas para este jugador.</gray>"

notification:
  join: "<prefix><gray>¡El chat de voz por proximidad está activo! Escribe <click:run_command:'/voice'><yellow><u>/voice</u></yellow></click> para unirte.</gray>"

error:
  invalid_syntax: "<prefix><red>Sintaxis inválida: <yellow><syntax></yellow></red>"
  generic: "<prefix><red>Ocurrió un error al ejecutar este comando.</red>"
