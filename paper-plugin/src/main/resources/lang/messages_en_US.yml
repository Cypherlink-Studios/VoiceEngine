# VoiceEngine English Language Bundle (en_US)
prefix: "<gradient:#00d2ff:#3a7bd5><b>[VoiceEngine]</b></gradient> "
prefix_admin: "<gradient:#f12711:#f5af19><b>[VoiceEngine Admin]</b></gradient> "

command:
  connect:
    prompt: "<prefix><click:open_url:'<url>'><hover:show_text:'<yellow>Click to open connection link</yellow>'><u><green>Click here to connect your microphone</green></u></hover></click> <gray>(code: <white><token></white>, expires in <time>)</gray>"
    only_players: "<prefix><red>Only players can connect to VoiceEngine.</red>"
    no_permission: "<prefix><red>You do not have permission to use VoiceEngine.</red>"
    backend_offline: "<prefix><red>Voice backend is offline. Unable to generate session.</red>"
  admin:
    prompt: "<prefix_admin><click:open_url:'<url>'><hover:show_text:'<gold>Click to open Admin Portal</gold>'><u><yellow>Click here to open the Admin Portal</yellow></u></hover></click> <gray>(code: <white><token></white>, expires in <time>)</gray>"
    no_permission: "<prefix_admin><red>You do not have permission to access the VoiceEngine admin portal.</red>"
    backend_offline: "<prefix_admin><red>Voice backend is offline. Unable to generate admin session.</red>"
  reload:
    success: "<prefix><green>Configuration and language files reloaded successfully!</green>"
    no_permission: "<prefix><red>You do not have permission to reload VoiceEngine.</red>"
  status:
    header: "<prefix><dark_aqua>--- VoiceEngine Backend Status ---</dark_aqua>"
    connected: "<gray>Status: <green>CONNECTED</green></gray>"
    disconnected: "<gray>Status: <red>DISCONNECTED</red> <dark_gray>(reconnect attempts: <yellow><attempts></yellow>)</dark_gray></gray>"
    uri: "<gray>Server URI: <aqua><uri></aqua></gray>"
    active_tokens: "<gray>Active Session Tokens: <gold><count></gold></gray>"
    no_permission: "<prefix><red>You do not have permission to inspect VoiceEngine status.</red>"
  speaker:
    created: "<prefix_admin><green>Speaker block <yellow><id></yellow> created at (<x>, <y>, <z>) with radius <radius>m.</green>"
    removed: "<prefix_admin><green>Speaker block <yellow><id></yellow> removed.</green>"
    not_found: "<prefix_admin><red>Speaker block <yellow><id></yellow> not found.</red>"
    already_exists: "<prefix_admin><red>Speaker block <yellow><id></yellow> already exists.</red>"
    must_look_at_block: "<prefix_admin><red>You must be looking at a solid block within 5 blocks.</red>"
    linked: "<prefix_admin><green>Linked voice of <yellow><player></yellow> to speaker <yellow><id></yellow>.</green>"
    unlinked: "<prefix_admin><green>Unlinked player voice from speaker <yellow><id></yellow>.</green>"
    redstone_set: "<prefix_admin><green>Speaker <yellow><id></yellow> redstone requirement set to <yellow><value></yellow>.</green>"
    play_started: "<prefix_admin><green>Playing <yellow><source></yellow> on speaker <yellow><id></yellow> (loop: <loop>).</green>"
    play_stopped: "<prefix_admin><green>Stopped media playback on speaker <yellow><id></yellow>.</green>"
    no_audio: "<prefix_admin><gray>Speaker <yellow><id></yellow> is not currently playing media.</gray>"
    list_header: "<prefix_admin><gold>--- Registered Speaker Blocks (<count>) ---</gold>"
    list_item: "<gray>- <yellow><id></yellow>: (<x>, <y>, <z>) in <world> | Radius: <radius>m | Linked: <aqua><linked></aqua> | Redstone: <redstone> | Media: <media></gray>"
    no_speakers: "<prefix_admin><gray>No speaker blocks registered.</gray>"
  audio:
    play_started: "<prefix_admin><green>Started spatial audio <yellow><id></yellow> at (<x>, <y>, <z>) radius <radius>m (loop: <loop>).</green>"
    broadcast_started: "<prefix_admin><green>Started global broadcast <yellow><id></yellow> (loop: <loop>).</green>"
    sfx_started: "<prefix_admin><green>Playing sound effect <yellow><id></yellow> (<source>).</green>"
    paused: "<prefix_admin><green>Paused audio emitter <yellow><id></yellow>.</green>"
    resumed: "<prefix_admin><green>Resumed audio emitter <yellow><id></yellow>.</green>"
    stopped: "<prefix_admin><green>Stopped audio emitter <yellow><id></yellow>.</green>"
    stopped_all: "<prefix_admin><green>Stopped all (<count>) active audio emitters.</green>"
    not_found: "<prefix_admin><red>Audio emitter <yellow><id></yellow> not found.</red>"
    volume_set: "<prefix_admin><green>Volume for emitter <yellow><id></yellow> set to <yellow><volume></yellow>.</green>"
    list_header: "<prefix_admin><gold>--- Active Audio Emitters (<count>) ---</gold>"
    list_item: "<gray>- <yellow><id></yellow>: <aqua><state></aqua> | <white><source></white> | <mode> | Vol: <volume> | Loop: <loop></gray>"
    no_emitters: "<prefix_admin><gray>No audio emitters currently active or paused.</gray>"
    files_header: "<prefix_admin><gold>--- Available Audio Files (<count>) ---</gold>"
    files_item: "<gray>- <yellow><file></yellow> <dark_gray>(<size>)</dark_gray></gray>"
    no_files: "<prefix_admin><gray>No audio files found in plugins/VoiceEngine/media/.</gray>"
    cache_status_requested: "<prefix_admin><green>Cache status inspection request sent to voice server.</green>"
    cache_status: "<prefix_admin><dark_aqua>Cache files: <gold><files></gold> | Total size: <gold><size></gold> | Limit: <gold><limit></gold></dark_aqua>"
    cache_purged: "<prefix_admin><green>Cache purge command sent to backend for duration: <yellow><duration></yellow>.</green>"
    particles_toggled: "<prefix_admin><green>Audio particle feedback set to: <yellow><state></yellow>.</green>"
  moderation:
    kick_success: "<prefix_admin><green>Kicked <yellow><player></yellow> from voice chat. Reason: <reason></green>"
    mute_success: "<prefix_admin><green>Muted <yellow><player></yellow> for <time>. Reason: <reason></green>"
    deafen_success: "<prefix_admin><green>Deafened <yellow><player></yellow> for <time>. Reason: <reason></green>"
    ban_success: "<prefix_admin><green>Banned <yellow><player></yellow> from voice chat for <time>. Reason: <reason></green>"
    unmute_success: "<prefix_admin><green>Unmuted <yellow><player></yellow>.</green>"
    undeafen_success: "<prefix_admin><green>Undeafened <yellow><player></yellow>.</green>"
    unban_success: "<prefix_admin><green>Unbanned <yellow><player></yellow>.</green>"
    player_not_found: "<prefix_admin><red>Player <yellow><player></yellow> not found.</red>"
    not_punished: "<prefix_admin><red>Player <yellow><player></yellow> is not currently <type>.</red>"
    kicked_notice: "<prefix><red>You were kicked from voice chat. Reason: <white><reason></white></red>"
    muted_notice: "<prefix><red>You have been muted in voice chat for <time>. Reason: <white><reason></white></red>"
    deafened_notice: "<prefix><red>You have been deafened in voice chat for <time>. Reason: <white><reason></white></red>"
    banned_notice: "<prefix><red>You are banned from voice chat for <time>. Reason: <white><reason></white></red>"
    unmuted_notice: "<prefix><green>You have been unmuted in voice chat.</green>"
    undeafened_notice: "<prefix><green>You have been undeafened in voice chat.</green>"
    status_header: "<prefix_admin><gold>--- Voice Moderation Status: <player> ---</gold>"
    status_active: "<gray>Active: <red><type></red> (Expires in: <yellow><time></yellow>) | Reason: <reason></gray>"
    status_none: "<prefix_admin><gray>No active voice sanctions for this player.</gray>"

notification:
  join: "<prefix><gray>Proximity voice is active! Type <click:run_command:'/voice'><yellow><u>/voice</u></yellow></click> to join.</gray>"

error:
  invalid_syntax: "<prefix><red>Invalid syntax: <yellow><syntax></yellow></red>"
  generic: "<prefix><red>An error occurred while executing this command.</red>"
