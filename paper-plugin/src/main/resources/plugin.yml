name: VoiceEngine
version: '1.1.1-SNAPSHOT'
main: com.voiceengine.VoiceEnginePlugin
api-version: '1.20'
author: VoiceEngine Team
description: Zero-mod Proximity Voice Chat Paper plugin
permissions:
  voiceengine.use:
    description: Allows connecting to VoiceEngine
    default: true
  voiceengine.admin:
    description: Allows accessing the VoiceEngine admin portal
    default: op
  voiceengine.admin.reload:
    description: Allows reloading VoiceEngine configuration and translations
    default: op
  voiceengine.admin.status:
    description: Allows viewing VoiceEngine backend connectivity and status
    default: op
  voiceengine.admin.speaker:
    description: Allows managing speaker blocks
    default: op
  voiceengine.admin.audio:
    description: Allows managing audio emitters and media playback
    default: op
  voiceengine.admin.update:
    description: Allows checking, viewing, and applying VoiceEngine plugin updates
    default: op
  voiceengine.room:
    description: Allows using temporary room commands
    default: true
  voiceengine.room.create:
    description: Allows creating temporary rooms
    default: true
  voiceengine.room.join:
    description: Allows joining temporary rooms
    default: true
  voiceengine.room.leave:
    description: Allows leaving temporary rooms
    default: true
  voiceengine.room.kick:
    description: Allows kicking members from owned temporary rooms
    default: true
  voiceengine.admin.vanish:
    description: Allows toggling acoustic staff vanish mode
    default: op
  voiceengine.admin.room.spy:
    description: Allows administrative wiretapping of temporary rooms
    default: op
