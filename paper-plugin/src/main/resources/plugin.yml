name: VoiceEngine
version: '1.0.0-SNAPSHOT'
main: com.voiceengine.VoiceEnginePlugin
api-version: '1.21'
author: VoiceEngine Team
description: Zero-mod Proximity Voice Chat Paper plugin
permissions:
  voiceengine.use:
    description: Allows connecting to VoiceEngine
    default: true
  voiceengine.admin:
    description: Allows accessing the VoiceEngine admin portal
    default: op
  voiceengine.admin.reload:
    description: Allows reloading VoiceEngine configuration and translations
    default: op
  voiceengine.admin.status:
    description: Allows viewing VoiceEngine backend connectivity and status
    default: op
  voiceengine.admin.speaker:
    description: Allows managing speaker blocks
    default: op
  voiceengine.admin.audio:
    description: Allows managing audio emitters and media playback
    default: op
