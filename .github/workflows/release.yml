name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Build Web Client
      - name: Build Web Client
        run: |
          cd web-client
          npm ci
          npm run build
          tar -czf ../web-client.tar.gz -C dist .

      # 2. Build Voice Server
      - name: Build Voice Server
        run: |
          cd voice-server
          npm ci
          npm run build
          tar -czf ../voice-server.tar.gz dist package.json

      # 3. Build Paper Plugin
      - name: Build Paper Plugin
        run: |
          cd paper-plugin
          chmod +x gradlew
          ./gradlew assemble --no-daemon
          find build/libs -maxdepth 1 -name "VoiceEngine-paper-*.jar" ! -name "*-thin.jar" -exec cp {} ../VoiceEngine-paper.jar \;

      # 4. Build Velocity Plugin
      - name: Build Velocity Plugin
        run: |
          cd velocity-plugin
          chmod +x gradlew
          ./gradlew assemble --no-daemon
          find build/libs -maxdepth 1 -name "VoiceEngine-velocity-*.jar" ! -name "*-thin.jar" -exec cp {} ../VoiceEngine-velocity.jar \;

      # 5. Generate SHA-256 Checksums
      - name: Generate Checksums
        run: |
          sha256sum voice-server.tar.gz web-client.tar.gz VoiceEngine-paper.jar VoiceEngine-velocity.jar > checksums.sha256

      # 6. Publish / Attach Assets to GitHub Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            voice-server.tar.gz
            web-client.tar.gz
            VoiceEngine-paper.jar
            VoiceEngine-velocity.jar
            checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
